<!DOCTYPE html>
<html lang="de" data-theme="cyber-cyan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayRig – Dokumentations- & API-Zentrale</title>

  <!-- PlayRig Tokens & Styles -->
  <link rel="stylesheet" href="../_shared/css/tokens.css">
  <link rel="stylesheet" href="../_shared/css/themes.css">
  <link rel="stylesheet" href="../_shared/css/base.css">
  <link rel="stylesheet" href="../_shared/css/components.css">
  <link rel="stylesheet" href="../_shared/css/animations.css">

  <!-- Marked Markdown Parser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    .docs-topbar {
      height: 56px;
      padding: 0 24px;
      background: rgba(10, 15, 29, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .docs-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .docs-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .docs-sidebar {
      width: 320px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 12px;
    }

    .docs-search-box {
      width: 100%;
      background: var(--bg-canvas);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color var(--transition-fast);
    }

    .docs-search-box:focus {
      border-color: var(--cyan-400);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }

    .docs-nav-category {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin: 12px 0 4px 6px;
    }

    .docs-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      cursor: pointer;
      border: 1px solid transparent;
    }

    .docs-nav-item:hover {
      background: var(--bg-surface-hover);
      color: #fff;
    }

    .docs-nav-item.active {
      background: rgba(0, 210, 255, 0.1);
      border-color: rgba(0, 210, 255, 0.3);
      color: var(--cyan-400);
      font-weight: 600;
    }

    /* Content Area */
    .docs-content-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 40px 48px;
      background: var(--bg-canvas);
      box-sizing: border-box;
    }

    .docs-article {
      max-width: 920px;
      margin: 0 auto;
      line-height: 1.7;
      font-size: 0.96rem;
      color: var(--text-normal);
    }

    .docs-article h1 {
      font-size: 2.1rem;
      color: #ffffff;
      margin-top: 0;
      border-bottom: 1px solid var(--border-default);
      padding-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .docs-article h2 {
      font-size: 1.45rem;
      color: #ffffff;
      margin-top: 36px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }

    .docs-article h3 {
      font-size: 1.18rem;
      color: var(--cyan-300);
      margin-top: 24px;
      margin-bottom: 10px;
    }

    .docs-article p {
      margin-bottom: 16px;
    }

    .docs-article ul, .docs-article ol {
      padding-left: 24px;
      margin-bottom: 18px;
    }

    .docs-article li {
      margin-bottom: 8px;
    }

    .docs-article table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.88rem;
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .docs-article th {
      background: var(--bg-glass-heavy);
      color: #ffffff;
      text-align: left;
      padding: 12px 16px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-default);
    }

    .docs-article td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .docs-article tr:last-child td {
      border-bottom: none;
    }

    .docs-article code {
      font-family: var(--font-mono);
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: var(--radius-xs);
      color: var(--cyan-300);
      font-size: 0.85em;
    }

    .docs-article pre {
      position: relative;
      background: #030712;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      overflow-x: auto;
      margin: 18px 0;
    }

    .docs-article pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .btn-copy-code {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-subtle);
      color: var(--text-dim);
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn-copy-code:hover {
      color: #fff;
      border-color: var(--cyan-400);
    }

    .docs-article blockquote {
      border-left: 3px solid var(--cyan-400);
      margin: 18px 0;
      padding: 10px 18px;
      background: rgba(0, 210, 255, 0.05);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      color: var(--text-secondary);
    }

    /* Live API Testing Console */
    .api-live-tester {
      margin: 24px 0;
      padding: 20px;
      background: #090e1a;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .api-tester-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .api-tester-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-family: var(--font-mono);
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .docs-layout {
        flex-direction: column;
        height: auto;
      }
      .docs-sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
      }
      .docs-content-wrapper {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body class="fx-spotlight-active">

  <!-- Topbar -->
  <header class="docs-topbar">
    <a href="/" class="docs-brand">
      <span style="font-size: 1.4rem;">⚡</span>
      <span>PlayRig <span class="gradient-text">Dokumentations-Zentrale</span></span>
      <span class="badge badge-cyan" style="font-size: 0.68rem; font-family: var(--font-mono);">v1.0.0</span>
    </a>

    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="/" class="btn btn-secondary btn-sm" title="Zurück zum Deck">
        ← PlayRig Deck
      </a>
      <a href="/studio" class="btn btn-secondary btn-sm" title="Zum Code Studio">
        ⚡ Studio
      </a>
      <a href="/admin" class="btn btn-ghost btn-sm" title="Administration">
        🛡️ Admin
      </a>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="docs-layout">
    <!-- Sidebar Navigation -->
    <aside class="docs-sidebar">
      <input type="text" id="docs-search" class="docs-search-box" placeholder="🔍 Handbuch durchsuchen...">

      <div id="docs-nav-tree">
        <!-- Dynamically populated from /api/v1/docs/list -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="docs-content-wrapper" id="docs-scroll-container">
      <div class="docs-article" id="docs-render-target">
        <div style="text-align: center; padding: 60px; color: var(--cyan-400);">
          ⏳ Lade Dokumentation...
        </div>
      </div>
    </main>
  </div>

  <script>
    let docsList = [];
    let currentDocId = 'system';

    async function loadDocsNavigation() {
      try {
        const res = await fetch('/api/v1/docs/list');
        const json = await res.json();
        if (json.success && Array.isArray(json.data)) {
          docsList = json.data;
          renderSidebar(docsList);

          // Check URL Hash for deep-linking (e.g. #api, #bridge)
          const hash = window.location.hash.replace('#', '');
          if (hash && docsList.some(d => d.id === hash)) {
            currentDocId = hash;
          }
          loadDocument(currentDocId);
        }
      } catch (e) {
        document.getElementById('docs-render-target').innerHTML = `
          <div style="color: var(--rose-400); padding: 40px; text-align: center;">
            <h3>Verbindungsfehler</h3>
            <p>Die Dokumentationsliste konnte nicht geladen werden.</p>
          </div>
        `;
      }
    }

    function renderSidebar(list) {
      const tree = document.getElementById('docs-nav-tree');
      tree.innerHTML = '';

      const categories = [...new Set(list.map(d => d.category))];
      categories.forEach(cat => {
        const catLabel = document.createElement('div');
        catLabel.className = 'docs-nav-category';
        catLabel.textContent = cat;
        tree.appendChild(catLabel);

        const items = list.filter(d => d.category === cat);
        items.forEach(doc => {
          const item = document.createElement('a');
          item.className = `docs-nav-item ${doc.id === currentDocId ? 'active' : ''}`;
          item.dataset.id = doc.id;
          item.innerHTML = `<span>${doc.icon}</span> <span>${doc.title}</span>`;
          item.addEventListener('click', () => {
            document.querySelectorAll('.docs-nav-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            window.location.hash = doc.id;
            loadDocument(doc.id);
          });
          tree.appendChild(item);
        });
      });
    }

    async function loadDocument(id) {
      currentDocId = id;
      const target = document.getElementById('docs-render-target');
      target.innerHTML = `<div style="text-align: center; padding: 60px; color: var(--cyan-400);">⏳ Lade '${id}'...</div>`;

      try {
        const res = await fetch(`/api/v1/docs/file/${id}`);
        const json = await res.json();
        if (!json.success || !json.data) {
          throw new Error(json.error?.message || 'Dokument konnte nicht abgerufen werden.');
        }

        const doc = json.data;
        const rawMarkdown = doc.content;

        // Render Markdown using marked.js
        if (typeof marked !== 'undefined') {
          target.innerHTML = marked.parse(rawMarkdown);
        } else {
          // Preformatted fallback
          target.innerHTML = `<pre>${rawMarkdown}</pre>`;
        }

        // Add Copy Button to code snippets
        target.querySelectorAll('pre').forEach(pre => {
          const btn = document.createElement('button');
          btn.className = 'btn-copy-code';
          btn.textContent = 'Kopieren';
          btn.addEventListener('click', () => {
            const code = pre.querySelector('code')?.innerText || pre.innerText;
            navigator.clipboard.writeText(code);
            btn.textContent = 'Kopiert! ✓';
            setTimeout(() => { btn.textContent = 'Kopieren'; }, 2000);
          });
          pre.appendChild(btn);
        });

        // If API Reference, prepend interactive live tester
        if (id === 'api') {
          prependApiTester(target);
        }

        document.getElementById('docs-scroll-container').scrollTop = 0;
      } catch (err) {
        target.innerHTML = `
          <div style="color: var(--rose-400); padding: 40px; text-align: center;">
            <h3>Fehler beim Laden der Dokumentation</h3>
            <p>${err.message}</p>
          </div>
        `;
      }
    }

    // Interactive Live API Tester component
    function prependApiTester(container) {
      const tester = document.createElement('div');
      tester.className = 'api-live-tester';
      tester.innerHTML = `
        <div class="api-tester-header">
          <div>
            <h3 style="margin: 0; color: #fff;">⚡ Interaktive API-Testkonsole</h3>
            <span style="font-size: 0.78rem; color: var(--text-dim);">Teste Live-Aufrufe direkt gegen die PlayRig Engine</span>
          </div>
          <span class="api-tester-badge">Live API v1</span>
        </div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
          <button class="btn btn-secondary btn-sm" onclick="runApiTest('/api/v1/auth/context')">GET /auth/context</button>
          <button class="btn btn-secondary btn-sm" onclick="runApiTest('/api/v1/rigs')">GET /rigs</button>
          <button class="btn btn-secondary btn-sm" onclick="runApiTest('/api/v1/services')">GET /services</button>
          <button class="btn btn-secondary btn-sm" onclick="runApiTest('/api/v1/docs')">GET /docs (Spec)</button>
        </div>

        <pre id="api-test-output" style="max-height: 220px; overflow-y: auto;"><code class="language-json">// Klicke auf einen der Buttons oben, um die API live abzufragen</code></pre>
      `;
      container.insertBefore(tester, container.firstChild);
    }

    window.runApiTest = async function(endpoint) {
      const out = document.getElementById('api-test-output');
      out.innerHTML = `<code>⏳ Sende Request an ${endpoint}...</code>`;
      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        out.innerHTML = `<code>${JSON.stringify(data, null, 2)}</code>`;
      } catch (e) {
        out.innerHTML = `<code>❌ Fehler: ${e.message}</code>`;
      }
    };

    // Filter sidebar by search input
    document.getElementById('docs-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = docsList.filter(d => 
        d.title.toLowerCase().includes(q) || 
        d.description.toLowerCase().includes(q) ||
        d.category.toLowerCase().includes(q)
      );
      renderSidebar(filtered);
    });

    document.addEventListener('DOMContentLoaded', loadDocsNavigation);
  </script>
</body>
</html>
