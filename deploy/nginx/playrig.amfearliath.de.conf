# ==============================================================================
# NGINX Configuration for PlayRig Engine
# Domain: playrig.amfearliath.de
# ==============================================================================

# HTTP zu HTTPS Weiterleitung
server {
    listen 80;
    listen [::]:80;
    server_name playrig.amfearliath.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Vollständiger Reverse-Proxy an Node.js Port 8882)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name playrig.amfearliath.de;

    # SSL-Zertifikate (Certbot)
    ssl_certificate /etc/letsencrypt/live/playrig.amfearliath.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrig.amfearliath.de/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip Kompression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upload-Limit für ZIP-Importe & Savegames
    client_max_body_size 50M;

    # Vollständiger Reverse Proxy an PlayRig Engine (Node.js Port 8882)
    location / {
        proxy_pass http://127.0.0.1:8882;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
