# ==============================================================================
# NGINX Configuration for PlayRig Engine
# Domain: playrig.amfearliath.de
# ==============================================================================

# Rate Limiting Zone
limit_req_zone $binary_remote_addr zone=playrig_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name playrig.amfearliath.de;

    # Allow Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS (aktivieren nach Certbot-Lauf)
    # return 301 https://$host$request_uri;

    # Fallback vor SSL-Einrichtung: Proxy direkt durchschleifen
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }
}

# HTTPS Server Block (Wird von Certbot automatisch befüllt oder manuell aktiviert)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name playrig.amfearliath.de;

    # SSL-Zertifikate (Pfade von Certbot)
    ssl_certificate /etc/letsencrypt/live/playrig.amfearliath.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrig.amfearliath.de/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Moderne SSL-Protokolle & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Erlaube Einbettung im GameChiller-Ecosystem via SAMEORIGIN
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip Kompression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Maximale Upload-Größe für ZIP-Projekt-Uploads & Savegames
    client_max_body_size 50M;

    # Document Root für statische Dateien & Assets
    root /var/www/playrig.amfearliath.de;
    index index.html;

    # Favicon Fallback zu favicon.svg
    location = /favicon.ico {
        try_files /favicon.ico /favicon.svg @proxy;
    }

    # API Endpunkte an Node.js weiterleiten
    location /api/ {
        limit_req zone=playrig_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Statische Assets: Schnell über NGINX ausliefern, bei Fehlen an Node delegieren
    location ~* \.(png|jpg|jpeg|gif|svg|woff2|woff|ttf|css|js)$ {
        try_files $uri @proxy;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Standard-Routen: Wenn Datei/Ordner existiert ausliefern, sonst an Node.js
    location / {
        try_files $uri $uri/ @proxy;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

