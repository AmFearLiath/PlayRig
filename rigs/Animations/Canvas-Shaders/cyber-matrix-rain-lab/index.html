<!DOCTYPE html>
<html lang="de" data-theme="emerald-matrix">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Matrix Rain Lab | PlayRig</title>

  <link rel="stylesheet" href="../../../../_shared/css/tokens.css">
  <link rel="stylesheet" href="../../../../_shared/css/themes.css">
  <link rel="stylesheet" href="../../../../_shared/css/base.css">
  <link rel="stylesheet" href="../../../../_shared/css/components.css">
  <link rel="stylesheet" href="../../../../_shared/css/animations.css">
  <link rel="stylesheet" href="./style.css">

  <script src="../../../../_shared/js/embed-bridge.js"></script>
  <script src="../../../../_shared/js/toast.js"></script>
</head>
<body class="fx-spotlight-active">
  <!-- Topbar -->
  <header class="rig-topbar">
    <div class="topbar-left">
      <a href="/" class="btn btn-ghost btn-sm btn-back-deck">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        PlayRig Deck
      </a>
      <div class="topbar-title-wrap">
        <h1 class="topbar-title">Cyber Matrix <span class="gradient-text-emerald">Rain Lab</span></h1>
        <span class="badge badge-emerald">Animations • Canvas-Shaders</span>
        <span class="badge badge-cyan topbar-version-badge">v0.0.1</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-meta-text">
        © GameChiller • Author: <strong style="color: #fff;">Liath</strong>
      </div>
      <button id="btn-ambient-audio" class="btn btn-secondary btn-sm" title="Synthetischer atmosphärischer Cyber-Regen">
        🌧️ Regen-Audio: Aus
      </button>
      <button id="btn-fullscreen-toggle" class="btn btn-secondary btn-sm" title="Vollbild-Modus">
        ⛶ Vollbild
      </button>
    </div>
  </header>

  <!-- Canvas Container -->
  <div class="matrix-canvas-container">
    <canvas id="matrix-canvas"></canvas>

    <!-- Floating HUD Controller -->
    <aside class="matrix-hud-panel glass-panel fx-beam" id="matrix-hud">
      <div class="hud-header">
        <h3 class="hud-title">Matrix Parameter</h3>
        <button id="btn-toggle-hud" class="btn-micro">Minimieren _</button>
      </div>

      <div class="hud-body">
        <!-- Glyphs Set -->
        <div class="form-group">
          <label class="form-label">Glyphen-Zeichensatz</label>
          <div class="glyph-chips-row">
            <button class="glyph-chip active" data-charset="katakana">Katakana</button>
            <button class="glyph-chip" data-charset="binary">Binär (0/1)</button>
            <button class="glyph-chip" data-charset="runes">Runen</button>
            <button class="glyph-chip" data-charset="matrix">Cyber Mix</button>
          </div>
        </div>

        <!-- Color Palette -->
        <div class="form-group">
          <label class="form-label">Farb-Matrix</label>
          <div class="color-palette-row">
            <button class="color-swatch-btn active" data-color="#10b981" data-glow="#059669" title="Matrix Emerald" style="background: #10b981;"></button>
            <button class="color-swatch-btn" data-color="#06b6d4" data-glow="#0891b2" title="Cyber Cyan" style="background: #06b6d4;"></button>
            <button class="color-swatch-btn" data-color="#f43f5e" data-glow="#e11d48" title="Crimson Voltage" style="background: #f43f5e;"></button>
            <button class="color-swatch-btn" data-color="#f59e0b" data-glow="#d97706" title="Obsidian Gold" style="background: #f59e0b;"></button>
            <button class="color-swatch-btn" data-color="#a855f7" data-glow="#9333ea" title="Vaporwave Purple" style="background: #a855f7;"></button>
          </div>
        </div>

        <!-- Fall Speed Slider -->
        <div class="form-group">
          <div style="display:flex; justify-content:space-between;">
            <label class="form-label">Geschwindigkeit</label>
            <span id="label-speed" class="slider-val">1.0x</span>
          </div>
          <input type="range" id="slider-speed" class="nexus-slider" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>

        <!-- Rain Density Slider -->
        <div class="form-group">
          <div style="display:flex; justify-content:space-between;">
            <label class="form-label">Regen-Dichte / Spalten</label>
            <span id="label-density" class="slider-val">Mittel</span>
          </div>
          <input type="range" id="slider-density" class="nexus-slider" min="12" max="28" step="2" value="18">
        </div>

        <!-- Interactive Mouse Wave Toggle -->
        <div class="form-group">
          <label class="nexus-checkbox-label">
            <input type="checkbox" id="check-mouse-wave" class="nexus-checkbox" checked>
            <span style="font-weight: 700; color: #fff;">Maus-Schockwelle (Impuls)</span>
          </label>
        </div>

        <div style="margin-top: 6px; display: flex; gap: 8px;">
          <button id="btn-burst-pulse" class="btn btn-primary btn-sm fx-ripple" style="flex:1;">
            💥 EMP-Impuls
          </button>
        </div>
      </div>
    </aside>
  </div>

  <script src="./app.js"></script>
</body>
</html>
