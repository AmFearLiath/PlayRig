<!DOCTYPE html>
<html lang="de" data-theme="cyber-cyan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Gravity Vortex | PlayRig</title>

  <!-- PlayRig Tokens & Styles -->
  <link rel="stylesheet" href="../../../../_shared/css/tokens.css">
  <link rel="stylesheet" href="../../../../_shared/css/themes.css">
  <link rel="stylesheet" href="../../../../_shared/css/base.css">
  <link rel="stylesheet" href="../../../../_shared/css/components.css">
  <link rel="stylesheet" href="../../../../_shared/css/animations.css">
  <script src="../../../../_shared/js/embed-bridge.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #04060a;
      font-family: var(--font-sans);
      color: #fff;
      user-select: none;
    }
    #vortex-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-overlay {
      position: absolute;
      top: 68px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-panel {
      pointer-events: auto;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 280px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .hud-controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }
  </style>
</head>
<body class="fx-spotlight-active">

  <!-- PlayRig Standard Header with Unsaved Changes Guard -->
  <header style="height: 52px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(10, 15, 29, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; z-index: 100;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="/" id="btn-back-hub" class="btn btn-ghost btn-sm" style="border: 1px solid var(--border-subtle); text-decoration: none;">← PlayRig Deck</a>
      <span style="font-weight: 700; font-size: 0.98rem; color: #fff;">Particle Gravity Vortex</span>
      <span class="badge badge-cyan">Visual FX</span>
    </div>
    <div style="font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono);">
      v0.0.1 • © GameChiller • Author: Liath
    </div>
  </header>

  <canvas id="vortex-canvas"></canvas>

  <div class="hud-overlay">
    <div class="hud-panel fx-beam">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:700; font-size:0.95rem; color:var(--cyan-400);">Vortex Physics Lab</span>
        <span id="particle-count-badge" class="badge badge-indigo">1.500 Partikel</span>
      </div>
      <p style="font-size:0.78rem; color:var(--text-muted); margin:0;">
        Bewege die Maus, um das Gravitationszentrum zu lenken. Klicke für eine Druckwellen-Explosion.
      </p>

      <div class="hud-controls-row">
        <label>Gravitation:</label>
        <input type="range" id="slider-gravity" min="1" max="10" value="5" class="nexus-slider" style="width:120px;">
      </div>

      <div class="hud-controls-row">
        <label>Partikel-Speed:</label>
        <input type="range" id="slider-speed" min="1" max="10" value="6" class="nexus-slider" style="width:120px;">
      </div>

      <div style="display:flex; gap:8px; margin-top:4px;">
        <button id="btn-explode" class="btn btn-primary btn-sm fx-ripple" style="flex:1;">💥 Schockwelle</button>
        <button id="btn-color-shift" class="btn btn-secondary btn-sm" style="flex:1;">🎨 Farbwechsel</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../../../_shared/js/toast.js"></script>
  <script src="../../../../_shared/js/embed-bridge.js"></script>
  <script src="../../../../_shared/js/fx-engine.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('vortex-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const PARTICLE_COUNT = 1500;
      const particles = [];
      let mouse = { x: width / 2, y: height / 2, active: false };
      let gravityStrength = 0.5;
      let speedFactor = 1.0;
      let colorMode = 0; // 0: Cyan/Blue, 1: Emerald/Neon, 2: Synthwave/Pink

      const PALETTES = [
        ['#00d2ff', '#3a7bd5', '#06b6d4', '#6366f1'],
        ['#10b981', '#059669', '#34d399', '#06b6d4'],
        ['#f43f5e', '#ec4899', '#a855f7', '#fbbf24']
      ];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          size: Math.random() * 2 + 1,
          color: PALETTES[colorMode][Math.floor(Math.random() * PALETTES[colorMode].length)],
          friction: 0.985
        });
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      });

      function createExplosion(x, y) {
        particles.forEach(p => {
          const dx = p.x - x;
          const dy = p.y - y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const force = (1200 / (dist + 50)) * 6;
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
        });
        if (window.PlayRigFX) window.PlayRigFX.triggerSparkle(canvas);
      }

      window.addEventListener('click', (e) => {
        if (e.target.closest('.hud-panel') || e.target.closest('header')) return;
        createExplosion(e.clientX, e.clientY);
      });

      document.getElementById('btn-explode').addEventListener('click', () => {
        createExplosion(mouse.x || width/2, mouse.y || height/2);
      });

      document.getElementById('btn-color-shift').addEventListener('click', () => {
        colorMode = (colorMode + 1) % PALETTES.length;
        particles.forEach(p => {
          p.color = PALETTES[colorMode][Math.floor(Math.random() * PALETTES[colorMode].length)];
        });
        window.showToast('Partikelfarben gewechselt', 'info');
      });

      document.getElementById('slider-gravity').addEventListener('input', (e) => {
        gravityStrength = e.target.value / 10;
      });

      document.getElementById('slider-speed').addEventListener('input', (e) => {
        speedFactor = e.target.value / 6;
      });

      function animate() {
        ctx.fillStyle = 'rgba(4, 6, 10, 0.2)';
        ctx.fillRect(0, 0, width, height);

        const targetX = mouse.active ? mouse.x : width / 2 + Math.cos(Date.now() * 0.001) * 200;
        const targetY = mouse.active ? mouse.y : height / 2 + Math.sin(Date.now() * 0.001) * 150;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const dx = targetX - p.x;
          const dy = targetY - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;

          // Orbital gravity pull
          const force = (gravityStrength * 40) / Math.max(dist, 40);
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;

          // Tangential swirl
          p.vx += (-dy / dist) * force * 0.6;
          p.vy += (dx / dist) * force * 0.6;

          p.vx *= p.friction;
          p.vy *= p.friction;

          p.x += p.vx * speedFactor;
          p.y += p.vy * speedFactor;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
